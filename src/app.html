<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AstroHour</title>
    <!-- Tells the webview to render native widgets (scrollbars, form controls)
         in dark mode. Without this WebKitGTK draws them with the light system
         theme, which is unreadable against our panels. -->
    <style>:root { color-scheme: dark; }</style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
