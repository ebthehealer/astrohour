<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · AstroHour</title>
  <meta name="description" content="{{desc}}">
  <meta property="og:title" content="{{title}} · AstroHour">
  <meta property="og:description" content="{{desc}}">
  <meta property="og:image" content="{{site_url}}/assets/shot-main.png">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/"><img src="/assets/icon.png" alt="" width="28" height="28"><span>AstroHour</span></a>
    <nav>
      <a href="/#features"{{nav_none}}>Features</a>
      <a href="/#download">Download</a>
      <a href="/about/"{{nav_about}}>About</a>
      <a href="/contact/"{{nav_contact}}>Contact</a>
      <a class="nav-donate" href="/donate/"{{nav_donate}}>♥ Donate</a>
    </nav>
  </header>
  <main>
{{content}}
  </main>
  <footer class="site-footer">
    <div class="foot-grid">
      <div><strong>AstroHour</strong><br>Planetary hours, moon phase and Moon sign, always in view.</div>
      <div>
        <a href="/about/">About</a>
        <a href="/contact/">Contact</a>
        <a href="/policies/">Policies</a>
        <a href="/donate/">Donate</a>
      </div>
      <div>
        <a href="{{github_url}}">Source on GitHub</a>
        <a href="{{releases_url}}">Releases</a>
        <a href="mailto:{{email}}">{{email}}</a>
      </div>
    </div>
    <p class="fine">AstroHour™ · Free to use, supported by donations · Works offline</p>
  </footer>

</html>
