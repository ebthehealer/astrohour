[package]
name = "astrohour"
version = "0.1.0"
description = "AstroHour — planetary hours status bar & home screen widget"
authors = ["eb@livethealt.life"]
edition = "2024"

[lib]
name = "astrohour_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core astronomical calculations (local crate)
astrohour-core = { path = "../../astrohour-core" }

# Tauri
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-geolocation = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
